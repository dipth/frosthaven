services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: frosthaven
      POSTGRES_PASSWORD: frosthaven
      POSTGRES_DB: frosthaven
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frosthaven -d frosthaven"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
