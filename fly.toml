# Private Frosthaven campaign app. Set the app name and region before the first deploy:
#   fly apps create <name> && fly volumes create frosthaven_data --size 5 --region <region>
#   fly secrets set DATABASE_URL=<neon pooled url> SESSION_SECRET=$(openssl rand -hex 32)
app = "frosthaven-just-the-tips"
primary_region = "fra"

[build]

[deploy]
  release_command = "node --import tsx src/db/migrate.ts"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  ASSETS_DIR = "/data/assets"
  BACKUP_DIR = "/data/backups"

[[mounts]]
  source = "frosthaven_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
