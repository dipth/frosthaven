name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: frosthaven
          POSTGRES_PASSWORD: frosthaven
          POSTGRES_DB: frosthaven_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U frosthaven" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://frosthaven:frosthaven@localhost:5433/frosthaven_test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('packages/data/sources.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:sync
      - run: pnpm typecheck
      - run: pnpm test
